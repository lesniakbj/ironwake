<!doctype html><html><meta charset="utf-8"><title>IRONWAKE vertical movement check</title><style>body{margin:0;background:#0a1220;color:white;font:13px monospace}canvas{width:100vw;height:88vh}nav{padding:8px;display:flex;gap:10px}button{background:#21344b;color:white;padding:8px;border:1px solid #647e94}#result{padding:8px}</style><canvas id="c"></canvas><nav><button id="ramp">Walk generated ramp</button><button id="perch">Land on high perch</button><button id="combat">View elevated combat</button></nav><div id="result">Ready</div><script type="module">
import{newWorld,mission,DEFAULT_BUILD,step,setInput}from'../dist/core.js';import{drawBattle3D,resetBattle}from'../dist/three-view.js';import{view}from'../dist/view-controls.js';let w,p,r,mode='',elapsed=0;function reset(){w=newWorld(mission(234),[{id:'0',name:'TEST',build:DEFAULT_BUILD}]);p=w.players[0];r=w.mission.ramps[0];w.mission.zones=[];w.mission.seed+=1;resetBattle();elapsed=0;}
function ramp(){reset();p.x=r.x+r.w/2;p.y=r.y+(r.sign>0?-20:r.h+20);view.yaw=r.sign>0?Math.PI/2:-Math.PI/2;view.pitch=-.09;mode='ramp';}
document.querySelector('#ramp').onclick=ramp;document.querySelector('#perch').onclick=()=>{reset();const perch=w.mission.platforms[1];p.x=perch.x+perch.w/2;p.y=perch.y+perch.h/2;p.altitude=235;view.yaw=.8;view.pitch=-.2;mode='perch';};document.querySelector('#combat').onclick=()=>{reset();const deck=w.mission.platforms[0];p.x=deck.x+180;p.y=deck.y+deck.h/2;p.altitude=deck.z;view.yaw=-Math.PI/2;view.pitch=-.17;w.enemies=[{id:5,type:'gunner',x:deck.x+300,y:deck.y+60,altitude:deck.z,hp:100,max:100,angle:1,stun:99,cd:99,speed:0,r:18},{id:6,type:'tank',x:deck.x+150,y:deck.y-100,altitude:0,hp:100,max:100,angle:1,stun:99,cd:99,speed:0,r:28}];mode='combat';};ramp();let last=0;function frame(t){const dt=Math.min(.04,last?(t-last)/1000:.016);last=t;if(mode==='ramp'){setInput(w,p.id,{y:p.altitude<r.z-.2?r.sign:0});}else setInput(w,p.id,{});step(w,dt);elapsed+=dt;const pass=mode==='ramp'?p.altitude>=r.z-.2:mode==='perch'?Math.abs(p.altitude-w.mission.platforms[1].z)<.2:true;document.querySelector('#result').textContent=`${pass?'PASS':'RUNNING'} · ${mode} · altitude ${p.altitude.toFixed(1)} · thrust ${p.energy.toFixed(0)} · ${elapsed.toFixed(1)}s`;drawBattle3D(document.querySelector('#c'),w,'0',t/1000);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
