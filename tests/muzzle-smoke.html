<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#11161c;color:#e9f5ff;font:16px sans-serif}header{position:fixed;z-index:2;left:20px;top:20px;background:#10151eea;padding:18px;max-width:400px}button,select{font:inherit;padding:8px;margin:6px}canvas{width:100vw;height:100vh}#status{display:block;color:#9cebd8}</style></head><body><header><b>BARREL ALIGNMENT · SLOW MOTION</b><br><select id="weapon" aria-label="Gun"></select><button id="fire">Fire</button><button id="move">Strafe + fly</button><button id="zoom">Zoom</button><span id="status">Ready</span></header><canvas id="battle"></canvas><script type="module">
import{newWorld,testPlatform,step,setInput,RANGED}from'../dist/core.js?v=17';import{drawBattle3D,resetBattle}from'../dist/three-view.js?v=17';import{view}from'../dist/view-controls.js?v=17';
let world,shoot=false,moving=false;const select=document.querySelector('#weapon'),canvas=document.querySelector('#battle');select.innerHTML=Object.entries(RANGED).map(([id,w])=>`<option value="${id}">${w.name}</option>`).join('');function reset(){world=newWorld(testPlatform(),[{id:'p',build:{weapon:select.value,parts:{booster:'heavy'}}}]);world.players[0].x=0;world.players[0].y=0;world.enemies=[{...world.enemies[0],x:700,y:0}];view.yaw=-.45;view.pitch=-.12;resetBattle();}select.onchange=reset;document.querySelector('#fire').onclick=()=>{shoot=!shoot;document.querySelector('#fire').textContent=shoot?'Stop firing':'Fire';};document.querySelector('#move').onclick=()=>moving=!moving;document.querySelector('#zoom').onclick=()=>view.aiming=!view.aiming;reset();function frame(t){const p=world.players[0];setInput(world,'p',{fire:shoot,angle:0,pitch:0,aimPoint:{x:700,y:0,z:38},y:moving?.3:0,fly:moving});step(world,.003);drawBattle3D(canvas,world,'p',t/1000);document.querySelector('#status').textContent=`${p.weapon} · ${p.shotCount} shots · target ${Math.ceil(world.enemies[0].hp)} HP · ${Math.round(p.altitude)}m`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
