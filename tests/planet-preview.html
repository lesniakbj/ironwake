<!doctype html><meta charset="utf-8"><title>Cinderfall mission QA</title><style>body{margin:0;background:#111;color:#baffc5;font:14px monospace}#controls{position:fixed;top:12px;left:12px;z-index:10;background:#101d16ee;padding:12px;max-width:85vw}button{padding:10px}canvas{width:100vw;height:100vh;display:block}</style><div id="controls"><button id="next">Next objective</button><button id="shoot">Fire weapons</button><button id="air">Toggle flight</button><span id="result"></span></div><canvas id="battle"></canvas><script type="module">
import{newWorld,planetMission,cleanBuild,mechStats,setInput,step}from'../dist/core.js?v=39';import{stepOperation,operationObjective}from'../dist/planet-mission.js?v=39';import{drawBattle3D,getAim}from'../dist/three-view.js?v=39';import{view}from'../dist/view-controls.js?v=39';
const world=newWorld(planetMission(38),[{id:'test',build:cleanBuild({equipment:['plasma','rail','emp'],parts:{booster:'heavy'}})}]),p=world.players[0];view.yaw=.25;view.pitch=-.02;let fire=false,fly=false,last=0,frames=0,total=0;
next.onclick=()=>{const o=world.operation;if(o.phase===0){world.time=86;world.kills=18;}else if(o.phase===1)world.enemies=[];else if(o.phase===2){o.delivered=6;o.crawler.segment=3;}else if(o.phase===3){world.enemies=[];}else{world.time=o.shipAt+1;}stepOperation(world,.05,mechStats);const target=world.enemies.find(e=>e.objective)||world.enemies.find(e=>e.type==='boss')||world.mission.zones[o.phase];p.x=target.x-260;p.y=target.y-80;p.altitude=target.altitude||0;view.yaw=Math.atan2(target.y-p.y,target.x-p.x);world.hazards=[];};shoot.onclick=()=>fire=!fire;air.onclick=()=>fly=!fly;
function frame(t){const dt=Math.min(.04,last?(t-last)/1000:.016);last=t;const start=performance.now();try{p.recoverUntil=world.time+1;setInput(world,p.id,{...getAim(p),left:fire,right:fire,fly});step(world,dt);drawBattle3D(battle,world,p.id,t/1000);total+=performance.now()-start;frames++;result.textContent=operationObjective(world,p).team+' · '+world.enemies.length+' actors · '+(total/frames).toFixed(1)+'ms simulation + render · '+Math.round(world.time)+'s';}catch(e){result.textContent=e.stack;return;}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
