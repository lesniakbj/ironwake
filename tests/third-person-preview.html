<!doctype html><meta charset="utf-8"><title>Third-person camera checks</title><style>body{margin:0;background:#111;color:white;font:14px sans-serif}#controls{position:fixed;top:12px;left:12px;z-index:10;background:#10151fee;padding:12px}button{padding:10px}canvas{width:100vw;height:100vh;display:block}</style><div id="controls"><button id="shield">Press F</button><button id="zoom">Zoom</button><button id="fire">Fire</button><button id="fly">Fly</button><button id="gun">Next gun</button><button id="pitch">Look up</button><button id="strike">Test blade</button><span id="result"></span></div><canvas id="battle"></canvas><script type="module">
import{newWorld,testPlatform,setInput,step,cleanBuild}from'../dist/core.js?v=39';import{drawBattle3D,getAim}from'../dist/three-view.js?v=39';import{view}from'../dist/view-controls.js?v=39';
const world=newWorld(testPlatform(),[{id:'test',build:cleanBuild({weapon:'carbine',melee:'guard',parts:{booster:'heavy'}})}]),p=world.players[0];view.yaw=world.mission.heading;view.pitch=-.06;let guard=false,fire=false,fly=false,last=0;const guns=['carbine','launcher','rail','flamer','phaser','scatter','rotary','plasma'];let gun=0;
shield.onclick=()=>{guard=!guard;shield.textContent=guard?'Release F':'Press F';};zoom.onclick=()=>{view.aiming=!view.aiming;};document.querySelector('#fire').onclick=()=>fire=!fire;document.querySelector('#fly').onclick=()=>fly=!fly;document.querySelector('#gun').onclick=()=>{gun=(gun+1)%guns.length;p.build=cleanBuild({...p.build,equipment:[guns[gun],null,'guard','emp']});};document.querySelector('#pitch').onclick=()=>view.pitch=view.pitch>0?-.06:.5;
document.querySelector('#strike').onclick=()=>{p.build=cleanBuild({...p.build,equipment:[guns[gun],null,'blade','emp']});guard=true;};
function frame(t){const dt=Math.min(.04,last?(t-last)/1000:.016);last=t;try{setInput(world,p.id,{...getAim(p),melee:guard,fire,fly});step(world,dt);drawBattle3D(battle,world,p.id,t/1000);result.textContent=`${p.weapon} · ${p.guarding?'SHIELD':p.meleeTime>0?'MELEE':'OPEN'} · ${world.damageEvents.length} hits · ${Math.round(p.altitude)} altitude`;}catch(e){result.textContent=e.stack;return;}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
