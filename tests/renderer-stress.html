import{newWorld,mission,DEFAULT_BUILD}from'../dist/core.js';import{drawBattle3D}from'../dist/three-view.js';import{view}from'../dist/view-controls.js';const w=newWorld(mission(234),[0,1,2,3].map(i=>({id:String(i),name:'TEST '+i,build:{...DEFAULT_BUILD,weapon:['carbine','launcher','blade','hammer'][i],color:['#ee7950','#74adca','#b3c9bd','#d3dadd'][i]}})));const zone=w.mission.zones[0];w.players.forEach((p,i)=>Object.assign(p,{x:zone.x-200,y:zone.y+i*40,angle:0,altitude:i===1?100:0}));view.yaw=0;w.enemies=Array.from({length:28},(_,i)=>({id:100+i,type:i===0?'boss':i%5===0?'tank':'gunner',x:zone.x+30+i%7*24,y:zone.y-100+Math.floor(i/7)*60,hp:100,max:100,stun:0,angle:Math.PI,windup:0,r:18}));w.bullets=Array.from({length:80},(_,i)=>({id:i,x:zone.x-150+i%20*15,y:zone.y-90+Math.floor(i/20)*50,z:38,vx:300,vy:0,vz:0,enemy:!!(i%2),life:1}));let start=0,count=0,frames=[];function frame(t){if(!start)start=t;const began=performance.now();drawBattle3D(document.querySelector('#c'),w,'0',t/1000);frames.push(performance.now()-began);count++;if(count===180){const duration=(t-start)/1000;frames.sort((a,b)=>a-b);document.querySelector('#result').textContent=`Completed — 4 pilots, 28 enemies, 80 projectiles. Average ${(count/duration).toFixed(1)} FPS; p95 render ${frames[Math.floor(frames.length*.95)].toFixed(1)}ms.`;}else if(count<180)requestAnimationFrame(frame);}requestAnimationFrame(frame);
