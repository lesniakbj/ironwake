<!doctype html><html><body style="background:#111;color:white;font:18px sans-serif"><button id="run">Verify combined mouse buttons</button><pre id="result">Ready</pre><iframe id="game" src="../dist/" style="width:1100px;height:650px;border:0"></iframe><script>
run.onclick=async()=>{const doc=game.contentDocument,win=game.contentWindow;doc.querySelector('#startPlay').click();const battle=doc.querySelector('#battle'),wait=ms=>new Promise(r=>setTimeout(r,ms)),mouse=(type,button,buttons)=>battle.dispatchEvent(new win.MouseEvent(type,{button,buttons,bubbles:true,clientX:550,clientY:300}));await wait(1200);mouse('mousedown',2,2);mouse('mousedown',0,3);await wait(800);const both={zoom:doc.querySelector('#zoomState').textContent,damage:doc.querySelectorAll('.damage-number').length,labels:doc.querySelector('#worldLabels').textContent};mouse('mouseup',0,2);await wait(120);const afterLeftRelease=doc.querySelector('#zoomState').textContent;mouse('mouseup',2,0);await wait(150);const afterBothReleased=doc.querySelector('#zoomState').textContent;result.textContent=JSON.stringify({both,afterLeftRelease,afterBothReleased,pass:both.zoom==='ZOOMED'&&both.damage>0&&!/TARGET|2000/.test(both.labels)&&afterLeftRelease==='ZOOMED'&&afterBothReleased==='RIGHT CLICK ZOOM'},null,2);};
</script></body></html>
