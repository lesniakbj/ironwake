<!doctype html><meta charset="utf-8"><title>IRONWAKE weapon roles preview</title><style>body{margin:0;background:#101719;color:#d0ffd5;font:14px monospace}canvas{width:100vw;height:100vh;display:block}#tools{position:fixed;top:16px;left:16px;right:16px;z-index:10;background:#0c181deb;padding:14px;border:1px solid #709380}button,select{padding:9px;margin-right:8px;background:#213530;color:#d0ffd5;border:1px solid #82b99b}output{display:block;margin-top:10px}#role{color:#ffe2a5}</style><div id="tools"><select id="weapon" aria-label="Weapon"></select><button id="fire">Fire continuously</button><button id="single">Fire once</button><button id="cluster">Cluster targets</button><button id="line">Line targets</button><button id="upper">Aim upper chassis</button><button id="pause">Pause</button><output id="role"></output><output id="result"></output></div><canvas id="battle"></canvas><script type="module">
import{newWorld,testPlatform,setInput,step,cleanBuild,RANGED}from'../dist/core.js?v=39';import{drawBattle3D}from'../dist/three-view.js?v=39';import{view}from'../dist/view-controls.js?v=39';
weapon.innerHTML=Object.entries(RANGED).map(([id,g])=>`<option value="${id}">${g.name.split(' / ').at(-1)}</option>`).join('');weapon.value='plasma';let w,p,held=false,one=false,paused=false,high=false,last=0,mode='cluster',seenOverloads=0;
function reset(){w=newWorld(testPlatform(),[{id:'test',build:cleanBuild({equipment:[weapon.value,'guard','emp'],parts:{booster:'heavy'}})}]);p=w.players[0];p.x=p.y=0;w.enemies=Array.from({length:3},(_,i)=>({id:'target-'+i,type:'target',training:true,x:mode==='line'?0:(i-1)*55,y:mode==='line'?-170-i*120:-170,altitude:0,hp:10000,max:10000,r:22,stun:0}));held=one=paused=false;seenOverloads=0;role.textContent=RANGED[weapon.value].desc;fire.textContent='Fire continuously';view.yaw=-Math.PI/2;view.pitch=-.16;}
weapon.onchange=reset;cluster.onclick=()=>{mode='cluster';reset();};line.onclick=()=>{mode='line';reset();};fire.onclick=()=>{held=!held;paused=false;fire.textContent=held?'Stop firing':'Fire continuously';};single.onclick=()=>{one=true;paused=false;};upper.onclick=()=>{high=!high;upper.textContent=high?'Aim body':'Aim upper chassis';};pause.onclick=()=>{paused=!paused;pause.textContent=paused?'Resume':'Pause';};reset();
function frame(t){const dt=Math.min(.025,last?(t-last)/1000:.016);last=t;if(!paused){const aim=w.enemies[mode==='cluster'?1:0];const ready=weapon.value!=='rail'||p.hands[0].shot<=0&&!p.hands[0].railCharging;setInput(w,p.id,{left:(held||one)&&ready,leftPressed:one,angle:-Math.PI/2,aimPoint:{x:aim.x,y:aim.y,z:high?51:32}});one=false;step(w,dt);drawBattle3D(battle,w,p.id,t/1000);result.textContent=`Shots ${p.hands[0].shotCount} · Damage ${w.enemies.map(e=>Math.round(e.max-e.hp)).join(' / ')} · Plasma charges ${w.enemies.map(e=>e.plasmaHits||0).join(' / ')} · Burn ${w.enemies.some(e=>e.burnUntil>w.time)?'ACTIVE':'—'} · Spin ${Math.round((p.hands[0].spin||0)*100)}%`; }requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
