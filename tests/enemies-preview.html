<!doctype html><meta charset="utf-8"><title>Robot roster and arrival checks</title><link rel="stylesheet" href="../dist/style.css?v=41"><style>body{margin:0;background:#10151c}#qa{position:fixed;top:8px;left:8px;z-index:1000;max-width:300px;background:#101b19dd;padding:10px;color:white;font:12px monospace}#qa button{padding:8px;margin:3px}#battle{width:100vw;height:100vh;display:block}#hullHealth{position:fixed;bottom:25px;right:25px;width:270px;background:#0b1f13;padding:14px}#taskBanner{display:block;position:fixed;left:50%;top:22px;z-index:5}</style><div id="qa"><button id="run">Run combat</button><button id="drop">Drop siege mech</button><button id="landing">Inspect landing</button><button id="rail">Hold rail</button><button id="hurt">Damage hull</button><button id="freeze">Freeze</button><p id="status"></p></div><canvas id="battle"></canvas><section id="taskBanner" hidden><div id="levelLabel"></div><p id="objectiveText"></p></section><div id="hullHealth"><div class="hull-heading"><b id="hullCondition">HULL</b><strong id="hullValue"></strong></div><div id="hullMeter"><i id="hullFill"></i></div></div><script type="module">
import{newWorld,planetMission,step,mechStats,setInput}from'../dist/core.js?v=41';import{queueHeavyDrop}from'../dist/planet-mission.js?v=41';import{taskStatus,hullStatus}from'../dist/hud-status.js?v=41';import{drawBattle3D,getAim}from'../dist/three-view.js?v=41';import{view}from'../dist/view-controls.js?v=41';
const w=newWorld(planetMission(39),[{id:'qa',build:{equipment:['rail','carbine','emp'],parts:{booster:'heavy'}}}]),p=w.players[0];p.x=1000;p.y=1000;p.altitude=0;p.recoverUntil=1e6;w.operation.nextWave=1e6;w.operation.nextStrike=1e6;w.operation.noticeUntil=0;view.yaw=0;view.pitch=.03;w.spawn=[{time:0,type:'drone',zone:{x:1230,y:790,exact:true,operation:true}},{time:0,type:'gunner',zone:{x:1270,y:1000,exact:true,operation:true}},{time:0,type:'tank',zone:{x:1200,y:1140,exact:true,operation:true}}];step(w,.01);let running=false,held=false,last=0,frames=0,total=0;
run.onclick=()=>running=true;landing.onclick=()=>{queueHeavyDrop(w,{x:1320,y:1040});for(let i=0;i<152;i++)step(w,.05);running=false;};drop.onclick=()=>{queueHeavyDrop(w,{x:1320,y:1000});running=true;};rail.onclick=()=>{held=!held;running=true;};hurt.onclick=()=>p.hp=28;freeze.onclick=()=>running=!running;
function frame(t){const dt=Math.min(.04,last?(t-last)/1000:.016);last=t;try{const start=performance.now();if(running){setInput(w,p.id,{...getAim(p),left:held});step(w,dt);}drawBattle3D(battle,w,p.id,t/1000);const task=taskStatus(w,p,view.yaw);taskBanner.hidden=!task.warning;taskBanner.className=task.heavy?'warning heavy-arrival':'warning';levelLabel.textContent=task.label;objectiveText.textContent=task.detail;const h=hullStatus(p,mechStats(p.build).hp);hullHealth.dataset.state=h.state;hullValue.textContent=h.current+' / '+h.max;hullFill.style.width=h.percent+'%';hullCondition.textContent=h.state==='critical'?'CRITICAL':'HULL';total+=performance.now()-start;frames++;document.querySelector('#status').textContent=`${w.time.toFixed(1)}s · ${p.hands[0].shotCount} rail shots · ${(total/frames).toFixed(1)}ms frame · ${w.enemies.filter(e=>e.species).length} robots · ${w.enemies.filter(e=>e.elite).length} heavies`;}catch(e){document.querySelector('#status').textContent=e.stack;return;}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
