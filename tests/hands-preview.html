<!doctype html><meta charset="utf-8"><title>Two-hand combat checks</title><style>body{margin:0;background:#111;color:#9f9;font:13px monospace}#controls{position:fixed;top:10px;left:10px;z-index:10;background:#071b12ee;padding:10px;max-width:800px}button{padding:8px;margin:2px}canvas{width:100vw;height:100vh;display:block}#result{display:block;padding:5px}</style><div id="controls"><button id="sword">Sword contact + wave</button><button id="hammer">Plasma slam</button><button id="side">Side view</button><button id="flight">Four contrails</button><button id="dual">Dual guns</button><button id="shieldLeft">Shield left + gun</button><button id="shieldRight">Gun + shield right</button><button id="lower">Lower shield</button><button id="left">Toggle left</button><button id="right">Toggle right</button><button id="resume">Pause / resume</button><span id="result"></span></div><canvas id="battle"></canvas><script type="module">
import{newWorld,testPlatform,setInput,step}from'../dist/core.js?v=39';import{drawBattle3D,resetBattle,getAim}from'../dist/three-view.js?v=39';import{view}from'../dist/view-controls.js?v=39';
let w,p,left=false,right=false,paused=true,last=0,flight=false;const canvas=document.querySelector('canvas'),result=document.querySelector('#result');
function reset(items){w=newWorld(testPlatform(),[{id:'qa',build:{equipment:[...items,'emp'],parts:{booster:'heavy'}}}]);p=w.players[0];p.x=p.y=0;view.yaw=-Math.PI/2;view.pitch=-.06;resetBattle();w.enemies=[[-80,0],[0,-85],[-60,-260],[60,-260],[0,150]].map(([x,y],i)=>({id:i,type:'target',training:true,x,y,altitude:0,hp:2000,max:2000,stun:0,r:15}));left=right=false;flight=false;paused=true;}
function advance(seconds){for(let t=0;t<seconds;t+=.01){setInput(w,p.id,{left,right,angle:view.yaw,pitch:0});step(w,.01);}}
document.querySelector('#side').onclick=()=>{view.yaw+=1;};document.querySelector('#flight').onclick=()=>{reset(['carbine','plasma']);flight=true;paused=false;};document.querySelector('#sword').onclick=()=>{reset(['blade','carbine']);left=true;advance(.2);left=false;advance(.06);};document.querySelector('#hammer').onclick=()=>{reset(['hammer','carbine']);left=true;advance(.61);left=false;};document.querySelector('#dual').onclick=()=>{reset(['carbine','launcher']);left=right=true;paused=false;};document.querySelector('#shieldLeft').onclick=()=>{reset(['guard','carbine']);left=right=true;paused=false;};document.querySelector('#shieldRight').onclick=()=>{reset(['carbine','guard']);left=right=true;paused=false;};document.querySelector('#lower').onclick=()=>{left=right=false;advance(.01);};document.querySelector('#left').onclick=()=>{left=!left;paused=false;};document.querySelector('#right').onclick=()=>{right=!right;paused=false;};document.querySelector('#resume').onclick=()=>paused=!paused;
reset(['blade','carbine']);function frame(t){const dt=Math.min(.04,last?(t-last)/1000:.016);last=t;if(!paused){setInput(w,p.id,{...getAim(p),left,right,fly:flight,x:flight?.7:0,y:flight?-.7:0});step(w,dt);}try{drawBattle3D(canvas,w,p.id,t/1000);result.textContent=`${p.hands.map((h,i)=>(i?'R: ':'L: ')+h.item+' '+(h.guarding?'BLOCK':h.shotCount+' shots / '+h.meleeImpactCount+' strikes')).join(' · ')} | Damage: ${w.damageEvents.map(e=>e.amount).join(', ')} | ${paused?'PAUSED':'LIVE'}`;}catch(e){result.textContent=e.stack;}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
