<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRONWAKE / Base chassis roster</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0e1620;color:#d5ece5;font:13px system-ui}header{padding:20px 24px;border-bottom:1px solid #314a4c}h1{margin:0 0 6px;font-size:22px;letter-spacing:.08em}header p{margin:0 0 12px;color:#99b8b5}button{background:#1b3035;border:1px solid #63847b;color:#d5ece5;padding:8px 13px;border-radius:4px;cursor:pointer}button[aria-pressed=true]{background:#b8e7be;color:#16251d}#classes{display:grid;grid-template-columns:repeat(5,1fr);background:#16252d}#classes span{text-align:center;padding:12px;border-right:1px solid #314a4c;font-weight:600;letter-spacing:.1em}#stage{height:900px;position:relative}canvas{width:100%;height:100%;display:block}#cards{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);pointer-events:none}article{padding:12px;border:1px solid #253b45;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(transparent 73%,#101923f0)}strong{font-size:17px;color:#d7f9dd}small{font-size:11px;line-height:1.5;color:#9fbcb9}output{display:block;padding:12px 24px;color:#aee0c0}.error{color:#ff9b82}@media(max-width:800px){#stage{height:720px}article{padding:6px}strong{font-size:12px}small{font-size:9px}#classes span{font-size:11px;padding:9px}header{padding:14px}h1{font-size:17px}}</style>
<header><h1>IRONWAKE / CHASSIS FOUNDRY</h1><p>15 base chassis · 3 per class · factory equipment · shared camera distance shows true relative size.</p><button id="rotate" aria-pressed="true">Auto rotate</button> <button id="standard" aria-pressed="false">Standard equipment for size comparison</button> <button id="test" aria-pressed="false">Test equipment</button></header>
<div id="classes"><span>SCOUT</span><span>LIGHT</span><span>MEDIUM</span><span>HEAVY</span><span>GIGA</span></div><div id="stage"><canvas id="gallery"></canvas><div id="cards"></div></div><output id="status">Loading chassis…</output>
<script type="module">
import * as T from '../dist/vendor/three.module.min.js';
import{CHASSIS,CHASSIS_CLASSES,chassisBlueprint}from '../dist/chassis.js';
import{cleanBuild,mechStats,WEAPONS}from '../dist/core.js?v=41';
import{makeMech,animateMech,disposeMech}from '../dist/three-view.js?v=41';
const canvas=document.getElementById('gallery'),status=document.getElementById('status'),cards=document.getElementById('cards');
window.addEventListener('error',e=>{status.className='error';status.textContent=e.message;});
const renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setScissorTest(true);
const camera=new T.PerspectiveCamera(34,1,.1,100);let yaw=.5,last=0,rotating=true,standard=false,firing=false,models=[];
const list=Array.from({length:3},(_,row)=>Object.keys(CHASSIS_CLASSES).map(size=>Object.values(CHASSIS).filter(c=>c.size===size)[row])).flat();
function reset(){models.forEach(m=>disposeMech(m.model));models=list.map((c,i)=>{
 const b=chassisBlueprint(c.id);if(standard)b.equipment=['blade','carbine','emp'];b.color=['#74adca','#b3c9bd','#ee7950','#e2d6b4','#b698c1'][i%5];const build=cleanBuild(b),stats=mechStats(build),scene=new T.Scene();scene.background=new T.Color(i%2?'#12212c':'#162834');scene.add(new T.HemisphereLight('#c6e6ee','#35404b',2.2));const light=new T.DirectionalLight('#fff0d3',3);light.position.set(-8,14,-10);scene.add(light);const rim=new T.DirectionalLight('#64bcff',1.8);rim.position.set(8,10,6);scene.add(rim);const model=makeMech(build);scene.add(model);const floor=new T.Mesh(new T.CylinderGeometry(5,5,.12,48),new T.MeshToonMaterial({color:'#243a42'}));floor.position.y=-.12;scene.add(floor);return{c,build,stats,scene,model};});
 cards.innerHTML=models.map(({c,stats})=>`<article><strong>${c.name}</strong><small>${c.role}<br>${stats.hp} armor · ${Math.round(stats.speed*stats.boost)} boost · ${stats.lift} lift<br>${c.scale.toFixed(2)}× size · ${c.hardpoints.heavy} heavy-rated / 2 hands</small></article>`).join('');}
document.getElementById('rotate').onclick=e=>e.currentTarget.setAttribute('aria-pressed',String(rotating=!rotating));document.getElementById('standard').onclick=e=>{e.currentTarget.setAttribute('aria-pressed',String(standard=!standard));reset();};document.getElementById('test').onclick=e=>e.currentTarget.setAttribute('aria-pressed',String(firing=!firing));reset();
function frame(ms){const t=ms/1000,dt=last?Math.min(.04,t-last):.016;last=t;if(rotating)yaw+=dt*.15;const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*renderer.getPixelRatio())||canvas.height!==Math.round(h*renderer.getPixelRatio()))renderer.setSize(w,h,false);let calls=0;
 for(const [i,m]of models.entries()){
  const hands=m.build.equipment.slice(0,2).map(id=>{const weapon=WEAPONS[id],f=t%2;return{item:id,shot:firing&&!weapon.melee&&f<1?weapon.rate:0,shotCount:firing?Math.floor(t/weapon.rate):0,railCharge:firing&&id==='rail'?f/2:0,motionCharge:1,meleeTime:firing&&weapon.melee&&id!=='guard'&&f<weapon.rate?weapon.rate-f:0,meleeCount:Math.floor(t/2),guarding:firing&&id==='guard'};});
  animateMech(m.model,{x:0,y:0,altitude:0,hp:100,angle:-Math.PI/2,hands,build:m.build},dt,t);const cw=w/5,ch=h/3;renderer.setViewport(i%5*cw,h-(Math.floor(i/5)+1)*ch,cw,ch);renderer.setScissor(i%5*cw,h-(Math.floor(i/5)+1)*ch,cw,ch);camera.aspect=cw/ch;camera.updateProjectionMatrix();camera.position.set(Math.sin(yaw)*32,8,-Math.cos(yaw)*32);camera.lookAt(0,4,0);renderer.render(m.scene,camera);calls+=renderer.info.render.calls;
 }
 if(!status.className)status.textContent=`15 chassis · ${calls} draw calls · ${standard?'identical equipment for comparison':'factory builds'} · same scale, hardpoints and model factory as gameplay`;requestAnimationFrame(frame);
}requestAnimationFrame(frame);
</script></html>
