<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRONWAKE / Chassis foundry</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1720;color:#d5ece5;font:13px system-ui}header{padding:20px 24px;border-bottom:1px solid #314a4c}h1{margin:0 0 7px;font-size:22px;letter-spacing:.08em}header p{margin:0 0 14px;color:#99b8b5;max-width:950px}nav,.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}button{background:#1b3035;border:1px solid #63847b;color:#d5ece5;padding:8px 12px;border-radius:4px;cursor:pointer}button[aria-pressed=true]{background:#b8e7be;color:#16251d}#stage{height:1140px;position:relative}#stage.focus{height:680px}canvas{width:100%;height:100%;display:block}#cards{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);pointer-events:none}#stage.focus #cards{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr}article{padding:15px 12px;border:1px solid #253b45;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(transparent 65%,#101923f5)}strong{font-size:18px;color:#d7f9dd}small{font-size:11px;line-height:1.5;color:#9fbcb9}em{font-style:normal;color:#d2a66d;font-size:11px;letter-spacing:.07em;text-transform:uppercase;margin:3px 0}article p{font-size:12px;color:#adc7c7;max-width:32ch;margin:7px 0}output{display:block;padding:12px 24px;color:#aee0c0}.error{color:#ff9b82}#stage.focus strong{font-size:24px}#stage.focus small{font-size:12px}#stage.focus article{padding:22px}#stage.focus article p{max-width:40ch}@media(max-width:800px){header{padding:14px}#stage{height:870px}#stage.focus{height:590px}article{padding:7px}strong{font-size:13px}small,em{font-size:9px}article p{font-size:10px}#stage.focus article{padding:10px}#stage.focus strong{font-size:17px}}
</style>
<header><h1>IRONWAKE / CHASSIS FOUNDRY</h1><p>Fifteen individually modeled platforms. Compare the whole roster at true relative scale, or inspect three chassis from one class. Bare frames and silhouette mode expose the body design beneath equipment and paint.</p>
<nav id="classes" aria-label="Chassis class"><button data-class="all" aria-pressed="true">All 15 / relative size</button></nav>
<div class="controls"><button id="rotate" aria-pressed="true">Auto rotate</button><button data-view="0">Front</button><button data-view="0.65">Three-quarter</button><button data-view="1.5708">Side</button><button data-view="3.14159">Rear</button></div>
<div class="controls"><button id="bare" aria-pressed="false">Bare frames</button><button id="paint" aria-pressed="false">Matching paint</button><button id="silhouette" aria-pressed="false">Silhouettes</button><button id="standard" aria-pressed="false">Matching equipment</button><button id="test" aria-pressed="false">Test equipment</button><button id="walk" aria-pressed="false">Walk cycle</button><button id="fly" aria-pressed="false">Flight / boosters</button></div></header>
<div id="stage"><canvas id="gallery"></canvas><div id="cards"></div></div><output id="status">Loading chassis…</output>
<script type="module">
import * as T from '../dist/vendor/three.module.min.js';
import{CHASSIS,CHASSIS_CLASSES,chassisBlueprint}from '../dist/chassis.js';
import{CHASSIS_ART}from '../dist/chassis-art.js';
import{cleanBuild,mechStats,WEAPONS}from '../dist/core.js?v=41';
import{makeMech,animateMech,disposeMech}from '../dist/three-view.js?v=41';
const canvas=document.getElementById('gallery'),status=document.getElementById('status'),cards=document.getElementById('cards'),stage=document.getElementById('stage');
window.addEventListener('error',e=>{status.className='error';status.textContent=e.message;});
const renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setScissorTest(true);
const camera=new T.PerspectiveCamera(34,1,.1,120),silhouetteMaterial=new T.MeshBasicMaterial({color:'#111923'}),floorGeometry=new T.CylinderGeometry(4.7,4.7,.12,48),floorMaterial=new T.MeshToonMaterial({color:'#243a42'});
let yaw=.65,last=0,rotating=true,standard=false,firing=false,bare=false,matching=false,silhouette=false,walking=false,flying=false,selected='all',models=[];
const all=Array.from({length:3},(_,row)=>Object.keys(CHASSIS_CLASSES).map(size=>Object.values(CHASSIS).filter(c=>c.size===size)[row])).flat();
document.getElementById('classes').insertAdjacentHTML('beforeend',Object.entries(CHASSIS_CLASSES).map(([id,c])=>`<button data-class="${id}" aria-pressed="false">${c.name}</button>`).join(''));
function reset(){
 models.forEach(m=>disposeMech(m.model));const list=selected==='all'?all:all.filter(c=>c.size===selected);stage.classList.toggle('focus',selected!=='all');
 models=list.map((c,i)=>{
  const b=chassisBlueprint(c.id);if(standard)b.equipment=['blade','carbine','emp'];b.color=matching?'#d3dadd':['#74adca','#b3c9bd','#ee7950','#e2d6b4','#b698c1'][Object.keys(CHASSIS_CLASSES).indexOf(c.size)];b.partColors={};
  const build=cleanBuild(b),stats=mechStats(build),scene=new T.Scene();scene.add(new T.HemisphereLight('#c6e6ee','#35404b',2.2));const light=new T.DirectionalLight('#fff0d3',3);light.position.set(-8,14,-10);scene.add(light);const rim=new T.DirectionalLight('#64bcff',1.8);rim.position.set(8,10,6);scene.add(rim);const model=makeMech(build);scene.add(model);const floor=new T.Mesh(floorGeometry,floorMaterial);floor.position.y=-.12;scene.add(floor);return{c,build,stats,scene,model,floor};
 });
 cards.innerHTML=models.map(({c,stats})=>`<article><strong>${c.name}</strong><em>${c.size} / ${CHASSIS_ART[c.id].name}</em><p>${CHASSIS_ART[c.id].description}</p><small>${stats.hp} armor · ${Math.round(stats.speed*stats.boost)} boost · ${stats.lift} lift<br>${c.scale.toFixed(2)}× size · ${c.hardpoints.heavy} heavy-rated / 2 hands</small></article>`).join('');
}
document.querySelectorAll('[data-class]').forEach(button=>button.onclick=()=>{selected=button.dataset.class;document.querySelectorAll('[data-class]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));reset();});
document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{yaw=Number(button.dataset.view);rotating=false;document.getElementById('rotate').setAttribute('aria-pressed','false');});
const toggle=(id,fn)=>document.getElementById(id).onclick=e=>{e.currentTarget.setAttribute('aria-pressed',String(fn()));};
toggle('rotate',()=>rotating=!rotating);toggle('standard',()=>{standard=!standard;reset();return standard;});toggle('test',()=>firing=!firing);toggle('bare',()=>bare=!bare);toggle('paint',()=>{matching=!matching;reset();return matching;});toggle('silhouette',()=>silhouette=!silhouette);toggle('walk',()=>walking=!walking);toggle('fly',()=>flying=!flying);reset();
function frame(ms){
 const t=ms/1000,dt=last?Math.min(.04,t-last):.016;last=t;if(rotating)yaw+=dt*.15;const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*renderer.getPixelRatio())||canvas.height!==Math.round(h*renderer.getPixelRatio()))renderer.setSize(w,h,false);let calls=0;
 for(const [i,m]of models.entries()){
  const hands=m.build.equipment.slice(0,2).map(id=>{const weapon=WEAPONS[id],f=t%2;return{item:id,shot:firing&&!weapon.melee&&f<1?weapon.rate:0,shotCount:firing?Math.floor(t/weapon.rate):0,railCharge:firing&&id==='rail'?f/2:0,motionCharge:1,meleeTime:firing&&weapon.melee&&id!=='guard'&&f<weapon.rate?weapon.rate-f:0,meleeCount:Math.floor(t/2),guarding:firing&&id==='guard'};});
  animateMech(m.model,{x:walking?t*160:0,y:0,altitude:0,hp:100,angle:-Math.PI/2,hands,build:m.build,airborne:flying,boosting:flying,boostX:flying?.3:0},dt,t);m.model.position.x=0;
  for(const kit of m.model.userData.kits){kit.root.visible=!bare;kit.trail.visible=!bare&&kit.trail.visible;}
  const columns=selected==='all'?5:3,rows=selected==='all'?3:1,cw=w/columns,ch=h/rows,modelHeight=ch-(selected==='all'?140:170),scale=selected==='all'?1:m.c.scale;
  m.scene.background=new T.Color(silhouette?'#d9e5e7':i%2?'#12212c':'#162834');m.scene.overrideMaterial=silhouette?silhouetteMaterial:null;m.floor.visible=!silhouette;
  renderer.setViewport(i%columns*cw,h-(Math.floor(i/columns)+1)*ch+(ch-modelHeight),cw,modelHeight);renderer.setScissor(i%columns*cw,h-(Math.floor(i/columns)+1)*ch,cw,ch);camera.aspect=cw/modelHeight;camera.updateProjectionMatrix();const distance=selected==='all'?22:(bare?18:23)*scale;camera.position.set(Math.sin(yaw)*distance,selected==='all'?8:7.2*scale,-Math.cos(yaw)*distance);camera.lookAt(0,selected==='all'?4.8:3*scale,0);renderer.render(m.scene,camera);calls+=renderer.info.render.calls;
 }
 if(!status.className)status.textContent=`${models.length} chassis · ${calls} draw calls · ${selected==='all'?'shared camera / true relative size':'class inspection'} · ${bare?'bare frames':'equipped'} · live gameplay models`;requestAnimationFrame(frame);
}requestAnimationFrame(frame);
</script></html>
