<!doctype html><html><head><style>body{margin:0;background:#101722;color:#fff;font:16px sans-serif}header{position:fixed;z-index:2;top:20px;left:20px;padding:15px;background:#111b28e0}canvas{width:100vw;height:100vh}button,select{font:inherit;padding:8px}#status{display:block}</style></head><body><header><b>EXPLOSION CHECK</b><select id="weapon"><option value="launcher">Rocket</option><option value="plasma">Plasma</option></select><button id="replay">Replay impact</button><label><input id="freeze" type="checkbox" checked>Freeze explosion</label><output id="status"></output></header><canvas id="battle"></canvas><script type="module">
import{newWorld,testPlatform,step,setInput}from'../dist/core.js?v=17';import{drawBattle3D,resetBattle}from'../dist/three-view.js?v=17';import{view}from'../dist/view-controls.js?v=17';
let w,held=false;function reset(){w=newWorld(testPlatform(),[{id:'p',build:{weapon:weapon.value,parts:{booster:'heavy'}}}]);w.players[0].x=0;w.players[0].y=0;w.enemies=w.enemies.slice(0,3).map((e,i)=>({...e,x:300,y:(i-1)*55}));view.yaw=0;view.pitch=-.08;resetBattle();setInput(w,'p',{fire:true,angle:0,aimPoint:{x:300,y:0,z:32}});step(w,.01);setInput(w,'p',{});held=false;}weapon.onchange=reset;replay.onclick=reset;reset();function frame(t){if(!held){step(w,.016);const blast=w.effects.find(e=>e.kind==='explosion');if(blast&&blast.max-blast.life>.2&&freeze.checked)held=true;}drawBattle3D(battle,w,'p',t/1000);document.querySelector('#status').textContent=`${w.effects.filter(e=>e.kind==='explosion').length} explosion · ${w.damageEvents.length} damage numbers · ${held?'Frozen at 0.2s':'Playing'}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
