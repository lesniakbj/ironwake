<!doctype html><meta charset="utf-8"><title>Dash and railgun preview</title><style>body{margin:0;background:#111;color:#fff;font:16px sans-serif}canvas{width:100vw;height:100vh;display:block}#tools{position:fixed;top:16px;left:16px;z-index:10;background:#10151fee;padding:14px;border:1px solid #768b86}button{padding:10px;margin-right:8px}output{display:block;margin-top:10px}</style><div id="tools"><button id="dash">Dash</button><button id="freeze">Freeze dash preview</button><button id="backward">Freeze backward dash</button><button id="rail">Click railgun once</button><button id="resume">Resume</button><output id="result"></output></div><canvas id="battle"></canvas><script type="module">
import{newWorld,testPlatform,setInput,step,cleanBuild}from'../dist/core.js?v=41';import{drawBattle3D}from'../dist/three-view.js?v=41';import{view}from'../dist/view-controls.js?v=41';
const w=newWorld(testPlatform(),[{id:'test',build:cleanBuild({equipment:['rail','guard','emp'],parts:{booster:'heavy'}})}]),p=w.players[0];view.yaw=-Math.PI/2;view.pitch=-.16;let last=0,paused=false,freezeAt=0,fire=false,dashing=false,back=false;
dash.onclick=()=>{paused=false;dashing=true;back=false;};backward.onclick=()=>{paused=false;dashing=true;back=true;p.dashCd=0;freezeAt=w.time+.19;};freeze.onclick=()=>{paused=false;dashing=true;p.dashCd=0;freezeAt=w.time+.19;};rail.onclick=()=>{paused=false;fire=true;};resume.onclick=()=>{paused=false;freezeAt=0;};
function frame(t){const dt=Math.min(.025,last?(t-last)/1000:.016);last=t;if(!paused){try{setInput(w,p.id,{angle:-Math.PI/2,x:dashing&&!back?1:0,y:dashing&&back?1:0,dash:dashing,leftPressed:fire});dashing=fire=false;step(w,dt);drawBattle3D(battle,w,p.id,t/1000);result.textContent=`Dash: ${p.dashCd.toFixed(1)}s · Rail shots: ${p.hands[0].shotCount} · ${p.hands[0].railCharging?'CHARGING '+Math.round(p.railCharge*100)+'%':p.hands[0].shot>0?'RECOVERING':'READY'}`;if(freezeAt&&w.time>=freezeAt){paused=true;freezeAt=0;result.textContent+=` · AIM ${p.angle.toFixed(2)} · DASH ${p.moveAngle.toFixed(2)} · PAUSED FOR INSPECTION`;}}catch(e){result.textContent=e.stack;return;}}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
