<!doctype html><html><body style="background:#111;color:white;font:18px sans-serif"><button id="run">Check sound mix</button><pre id="result">Ready</pre><script type="module">
import{createSoundBus,playWeaponSound,createBeamSound,createThrusterSound,playMeleeSound}from '../dist/sound-design.js?v=13';document.querySelector('#run').onclick=async()=>{const out=[];for(const id of ['carbine','scatter','rail','launcher','plasma','rotary','phaser','thruster','hammer']){const ctx=new OfflineAudioContext(2,72000,48000),bus=createSoundBus(ctx);if(id==='phaser')createBeamSound(ctx,bus).update(true,true);else if(id==='thruster')createThrusterSound(ctx,bus).update(1.45,'heavy');else if(id==='hammer')playMeleeSound(ctx,bus,'hammer',true);else playWeaponSound(ctx,bus,id,1);const audio=await ctx.startRendering();let peak=0,sum=0;const data=audio.getChannelData(0);for(const v of data){peak=Math.max(peak,Math.abs(v));sum+=v*v;}out.push({id,peak:+peak.toFixed(3),rms:+Math.sqrt(sum/data.length).toFixed(4),pass:Number.isFinite(sum)&&peak>.01&&peak<.95});}document.querySelector('#result').textContent=JSON.stringify(out,null,2);};
</script></body></html>
