<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRONWAKE / Mission foundry</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d1720;color:#d8eddf;font:13px system-ui}header{padding:22px 28px;border-bottom:1px solid #455b57}h1{font-size:23px;margin:0 0 8px}p{color:#a1bbb4;margin:0 0 14px}button,select{padding:8px 12px;background:#203a37;color:#d8eddf;border:1px solid #66857d}a{color:#b3e5ba;margin-left:15px}#stage{height:1260px;position:relative}#stage.focus{height:750px}canvas{display:block;width:100%;height:100%}#labels{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);pointer-events:none}#stage.focus #labels{grid-template-columns:1fr}article{border:1px solid #3b4b4f;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(transparent 70%,#0b1722f5)}article strong{font-size:20px}article small{font-size:11px;line-height:1.6;color:#b8cfca}output{padding:15px 28px;display:block}.error{color:#ff947e}@media(max-width:800px){#stage{height:1140px}article{padding:10px}article strong{font-size:14px}article small{font-size:10px}}</style>
<header><h1>IRONWAKE / MISSION FOUNDRY</h1><p>Nine authored rounds · three acts · shared gameplay geometry, objectives and collision layouts. Select a mission to inspect its arena.</p><select id="mission" aria-label="Mission"><option value="all">All nine arenas</option></select> <button id="angle">View: angled</button><a href="/ironwake/">Campaign / live mission drills ↗</a></header>
<div id="stage"><canvas id="gallery"></canvas><div id="labels"></div></div><output id="status">Loading mission layouts…</output>
<script type="module">
import * as T from '../dist/vendor/three.module.min.js';
import{MISSIONS,campaignRound}from '../dist/mission-catalog.js';
import{newWorld}from '../dist/core.js?v=41';
import{chassisBlueprint}from '../dist/chassis.js';
import{buildPlanet,updatePlanet,makeMissionObjective,updateMissionObjective}from '../dist/planet-scene.js?v=41';
const canvas=document.getElementById('gallery'),stage=document.getElementById('stage'),labels=document.getElementById('labels'),status=document.getElementById('status'),select=document.getElementById('mission');
window.addEventListener('error',e=>{status.className='error';status.textContent=e.message;});
select.insertAdjacentHTML('beforeend',MISSIONS.map((m,i)=>`<option value="${m.id}">${i+1}. ${m.name}</option>`).join(''));
const renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setScissorTest(true);const camera=new T.PerspectiveCamera(45,1,.1,1200);let top=false;
const models=MISSIONS.map(spec=>{const m=campaignRound(spec.id,42),w=newWorld(m,[{id:'p',build:chassisBlueprint('vanguard')}]),scene=new T.Scene(),group=new T.Group();scene.background=new T.Color(spec.sky);scene.add(group,new T.HemisphereLight('#d9f3ef','#31394b',2));const sun=new T.DirectionalLight('#fff1d0',3);sun.position.set(-80,200,-60);scene.add(sun);buildPlanet(group,m,[]);for(const e of w.enemies)if(e.objective){const o=makeMissionObjective(e);scene.add(o);updateMissionObjective(o,e,0);}return{scene,group,w,spec};});
function updateLabels(){const list=select.value==='all'?models:models.filter(m=>m.spec.id===select.value);stage.classList.toggle('focus',list.length===1);labels.innerHTML=list.map(({spec,w})=>`<article><strong>${String(w.mission.sector).padStart(2,'0')} / ${spec.name}</strong><small>ACT ${spec.act} · ${spec.kind.toUpperCase()} · ~${spec.minutes} MIN<br>${spec.brief}</small></article>`).join('');}
select.onchange=updateLabels;document.getElementById('angle').onclick=e=>{top=!top;e.currentTarget.textContent='View: '+(top?'top down':'angled');};updateLabels();
function frame(ms){const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*renderer.getPixelRatio())||canvas.height!==Math.round(h*renderer.getPixelRatio()))renderer.setSize(w,h,false);const list=select.value==='all'?models:models.filter(m=>m.spec.id===select.value),cols=list.length===1?1:3,rows=list.length===1?1:3,cw=w/cols,ch=h/rows,viewHeight=ch-100;let calls=0;
 for(const [i,m]of list.entries()){updatePlanet(m.group,m.w,ms/1000);renderer.setViewport(i%cols*cw,h-(Math.floor(i/cols)+1)*ch+100,cw,viewHeight);renderer.setScissor(i%cols*cw,h-(Math.floor(i/cols)+1)*ch,cw,ch);camera.aspect=cw/viewHeight;camera.updateProjectionMatrix();const distance=list.length===1?300:360;camera.position.set(top?130:130+distance*.22,top?distance:distance*.82,top?115.01:115+distance*.65);camera.lookAt(130,0,115);renderer.render(m.scene,camera);calls+=renderer.info.render.calls;}
 if(!status.className)status.textContent=`${list.length} authored arenas · ${calls} draw calls · actual mission geometry and objective meshes`;requestAnimationFrame(frame);
}requestAnimationFrame(frame);
</script></html>
